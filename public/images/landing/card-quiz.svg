<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1E24" />
      <stop offset="50%" stop-color="#14171C" />
      <stop offset="100%" stop-color="#0E1014" />
    </linearGradient>
    <radialGradient id="cardGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#2A4365" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#14171C" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#cardBg)" />
  <circle cx="400" cy="370" r="320" fill="url(#cardGlow)" />

  <!-- Outer Fine Boundary -->
  <rect x="24" y="24" width="752" height="752" rx="20" fill="none" stroke="#F5F4EF" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Central Visual: Optical Perception & Dual Lens -->
  <g transform="translate(400, 370)">
    <!-- Concentric Architectural Precision Rings -->
    <circle cx="0" cy="0" r="230" fill="none" stroke="#F5F4EF" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="3 6" />
    <circle cx="0" cy="0" r="170" fill="none" stroke="#2A4365" stroke-opacity="0.5" stroke-width="1.5" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="#F5F4EF" stroke-opacity="0.2" stroke-width="1" />
    
    <!-- Central Split Aperture -->
    <path d="M 0 -100 A 100 100 0 0 0 0 100 Z" fill="#2A4365" fill-opacity="0.3" stroke="#F5F4EF" stroke-opacity="0.4" stroke-width="1.5" />
    <path d="M 0 -100 A 100 100 0 0 1 0 100 Z" fill="#F5F4EF" fill-opacity="0.06" stroke="#2A4365" stroke-opacity="0.8" stroke-width="1.5" />
    
    <!-- Crosshairs -->
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#F5F4EF" stroke-opacity="0.25" stroke-width="1" />
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#F5F4EF" stroke-opacity="0.25" stroke-width="1" />
    <circle cx="0" cy="0" r="8" fill="#F5F4EF" />
    <circle cx="0" cy="0" r="24" fill="none" stroke="#2A4365" stroke-width="2" />
  </g>

  <!-- Card Typography Overlay -->
  <g text-anchor="middle" font-family="'Poppins', sans-serif">
    <!-- Top Pill -->
    <rect x="250" y="60" width="300" height="32" rx="16" fill="#F5F4EF" fill-opacity="0.06" stroke="#F5F4EF" stroke-opacity="0.15" />
    <text x="400" y="81" fill="#D9D9D4" font-size="11" font-weight="500" letter-spacing="3.5">THE 15-ROUND TEST</text>
    
    <!-- Bottom Headings -->
    <text x="400" y="690" fill="#F5F4EF" font-size="28" font-weight="600" letter-spacing="2">START THE QUIZ</text>
    <text x="400" y="722" fill="#9EA8B6" font-size="13" font-weight="400" letter-spacing="2.5">15 SUBJECTS • HUMAN OR AI?</text>
  </g>
</svg>
