<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1E24" />
      <stop offset="50%" stop-color="#14171C" />
      <stop offset="100%" stop-color="#0E1014" />
    </linearGradient>
    <radialGradient id="cardGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#2A4365" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#14171C" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="800" fill="url(#cardBg)" />
  <circle cx="400" cy="370" r="320" fill="url(#cardGlow)" />

  <rect x="24" y="24" width="752" height="752" rx="20" fill="none" stroke="#F5F4EF" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Central Visual: Discourse & Feedback Network in Unified Palette -->
  <g transform="translate(400, 370)">
    <!-- Dialogue Envelope & Signal Nodes in Cobalt & Ivory -->
    <rect x="-140" y="-95" width="280" height="175" rx="14" fill="#14181F" stroke="#F5F4EF" stroke-opacity="0.25" stroke-width="2" />
    <path d="M -140 -85 L 0 20 L 140 -85" fill="none" stroke="#F5F4EF" stroke-opacity="0.4" stroke-width="2" />
    <path d="M -140 65 L -45 -10" fill="none" stroke="#F5F4EF" stroke-opacity="0.2" stroke-width="1.5" />
    <path d="M 140 65 L 45 -10" fill="none" stroke="#F5F4EF" stroke-opacity="0.2" stroke-width="1.5" />

    <!-- Center Deep Cobalt Seal -->
    <circle cx="0" cy="20" r="28" fill="#2A4365" stroke="#F5F4EF" stroke-opacity="0.5" stroke-width="2" />
    <polygon points="-7,11 0,28 7,11" fill="#F5F4EF" />
    
    <!-- Outer Minimal Pulse Rings -->
    <circle cx="0" cy="20" r="150" fill="none" stroke="#F5F4EF" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="6 8" />
  </g>

  <!-- Card Typography Overlay -->
  <g text-anchor="middle" font-family="'Poppins', sans-serif">
    <rect x="250" y="60" width="300" height="32" rx="16" fill="#F5F4EF" fill-opacity="0.06" stroke="#F5F4EF" stroke-opacity="0.15" />
    <text x="400" y="81" fill="#D9D9D4" font-size="11" font-weight="500" letter-spacing="3.5">COMMUNITY &amp; INQUIRY</text>
    
    <text x="400" y="690" fill="#F5F4EF" font-size="28" font-weight="600" letter-spacing="2">GET IN TOUCH</text>
    <text x="400" y="722" fill="#9EA8B6" font-size="13" font-weight="400" letter-spacing="2.5">FEEDBACK &amp; SUBMISSIONS</text>
  </g>
</svg>
