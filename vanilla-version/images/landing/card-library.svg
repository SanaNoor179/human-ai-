<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1E24" />
      <stop offset="50%" stop-color="#14171C" />
      <stop offset="100%" stop-color="#0E1014" />
    </linearGradient>
    <radialGradient id="cardGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#2A4365" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#14171C" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="800" fill="url(#cardBg)" />
  <circle cx="400" cy="370" r="320" fill="url(#cardGlow)" />

  <rect x="24" y="24" width="752" height="752" rx="20" fill="none" stroke="#F5F4EF" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Central Visual: Archival Gallery Frame & Curation Grid in Palette -->
  <g transform="translate(400, 370)">
    <!-- Architectural grid planes in background -->
    <rect x="-180" y="-150" width="120" height="150" rx="6" fill="#1A1E24" stroke="#F5F4EF" stroke-opacity="0.12" stroke-width="1.5" />
    <rect x="60" y="-150" width="120" height="150" rx="6" fill="#1A1E24" stroke="#F5F4EF" stroke-opacity="0.12" stroke-width="1.5" />
    
    <!-- Central Curated Exhibition Frame -->
    <rect x="-115" y="-110" width="230" height="260" rx="10" fill="#101317" stroke="#F5F4EF" stroke-opacity="0.35" stroke-width="2" />
    <rect x="-95" y="-90" width="190" height="220" rx="6" fill="#161A20" stroke="#2A4365" stroke-width="1.5" />

    <!-- Minimalist Artwork silhouette inside frame -->
    <circle cx="0" cy="-10" r="42" fill="#2A4365" fill-opacity="0.35" stroke="#F5F4EF" stroke-opacity="0.3" stroke-width="1.5" />
    <line x1="-50" y1="55" x2="50" y2="55" stroke="#F5F4EF" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round" />
    <line x1="-30" y1="75" x2="30" y2="75" stroke="#2A4365" stroke-width="2" stroke-linecap="round" />

    <!-- Magnifying Curation Ring (Cobalt & White) -->
    <circle cx="70" cy="70" r="44" fill="#14171C" fill-opacity="0.8" stroke="#F5F4EF" stroke-width="3" />
    <circle cx="70" cy="70" r="38" fill="none" stroke="#2A4365" stroke-width="1.5" />
    <line x1="101" y1="101" x2="135" y2="135" stroke="#F5F4EF" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Card Typography Overlay -->
  <g text-anchor="middle" font-family="'Poppins', sans-serif">
    <rect x="250" y="60" width="300" height="32" rx="16" fill="#F5F4EF" fill-opacity="0.06" stroke="#F5F4EF" stroke-opacity="0.15" />
    <text x="400" y="81" fill="#D9D9D4" font-size="11" font-weight="500" letter-spacing="3.5">FULL CATALOGUE</text>
    
    <text x="400" y="690" fill="#F5F4EF" font-size="28" font-weight="600" letter-spacing="2">IMAGE ARCHIVE</text>
    <text x="400" y="722" fill="#9EA8B6" font-size="13" font-weight="400" letter-spacing="2.5">BROWSE ALL 15 SUBJECTS</text>
  </g>
</svg>
