<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1E24" />
      <stop offset="50%" stop-color="#14171C" />
      <stop offset="100%" stop-color="#0E1014" />
    </linearGradient>
    <radialGradient id="cardGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#2A4365" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#14171C" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="800" fill="url(#cardBg)" />
  <circle cx="400" cy="370" r="320" fill="url(#cardGlow)" />

  <rect x="24" y="24" width="752" height="752" rx="20" fill="none" stroke="#F5F4EF" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Central Visual: Research Methodology & Cognitive Eye in Unified Palette -->
  <g transform="translate(400, 370)">
    <!-- Eye of Perception in Minimal Ivory / Cobalt -->
    <path d="M -170 0 Q 0 -120 170 0 Q 0 120 -170 0 Z" fill="none" stroke="#F5F4EF" stroke-opacity="0.4" stroke-width="2" />
    <circle cx="0" cy="0" r="66" fill="#14181F" stroke="#2A4365" stroke-width="2.5" />
    <circle cx="0" cy="0" r="34" fill="#0E1014" stroke="#F5F4EF" stroke-opacity="0.6" stroke-width="1.5" />
    <circle cx="9" cy="-9" r="9" fill="#F5F4EF" />

    <!-- Calibration Tickmarks -->
    <line x1="0" y1="-170" x2="0" y2="-135" stroke="#2A4365" stroke-width="2" stroke-linecap="round" />
    <line x1="120" y1="-120" x2="95" y2="-95" stroke="#2A4365" stroke-width="2" stroke-linecap="round" />
    <line x1="170" y1="0" x2="205" y2="0" stroke="#2A4365" stroke-width="2" stroke-linecap="round" />
    <line x1="120" y1="120" x2="95" y2="95" stroke="#2A4365" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="170" x2="0" y2="135" stroke="#2A4365" stroke-width="2" stroke-linecap="round" />
    <line x1="-120" y1="120" x2="-95" y2="95" stroke="#2A4365" stroke-width="2" stroke-linecap="round" />
    <line x1="-170" y1="0" x2="-205" y2="0" stroke="#2A4365" stroke-width="2" stroke-linecap="round" />
    <line x1="-120" y1="-120" x2="-95" y2="-95" stroke="#2A4365" stroke-width="2" stroke-linecap="round" />

    <text x="0" y="195" fill="#D9D9D4" font-family="'Newsreader', serif" font-style="italic" font-size="19" text-anchor="middle" letter-spacing="0.5">“Evaluating art before knowing the creator”</text>
  </g>

  <!-- Card Typography Overlay -->
  <g text-anchor="middle" font-family="'Poppins', sans-serif">
    <rect x="250" y="60" width="300" height="32" rx="16" fill="#F5F4EF" fill-opacity="0.06" stroke="#F5F4EF" stroke-opacity="0.15" />
    <text x="400" y="81" fill="#D9D9D4" font-size="11" font-weight="500" letter-spacing="3.5">RESEARCH METHODOLOGY</text>
    
    <text x="400" y="690" fill="#F5F4EF" font-size="28" font-weight="600" letter-spacing="2">ABOUT THE STUDY</text>
    <text x="400" y="722" fill="#9EA8B6" font-size="13" font-weight="400" letter-spacing="2.5">COGNITIVE IMPACT &amp; AESTHETICS</text>
  </g>
</svg>
